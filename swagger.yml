openapi: 3.0.0
info:
  title: "API REST de Personas y Pizzas"
  description: "API para administrar personas y las pizzas que pidió cada una"
  version: "1.1.0"

servers:
  - url: "/api"

components:
  schemas:
    Pizza:
      type: "object"
      properties:
        id:
          type: "integer"
          readOnly: true
        person_id:
          type: "integer"
          description: "ID de la persona que pidió la pizza"
        content:
          type: "string"
          description: "Descripción de la pizza"
          minLength: 1
          pattern: "\\S"
        price:
          type: "number"
          description: "Precio de la pizza (mayor que 0)"
          minimum: 0
          exclusiveMinimum: true
          example: 9500
        size:
          type: "string"
          description: "Tamaño de la pizza"
          enum:
            - "chica"
            - "mediana"
            - "grande"
        timestamp:
          type: "string"
          format: "date-time"
          readOnly: true
    Person:
      type: "object"
      required:
        - lname
      properties:
        id:
          type: "integer"
          readOnly: true
        fname:
          type: "string"
          description: "Nombre"
        lname:
          type: "string"
          description: "Apellido (único, identifica a la persona en la URL)"
          minLength: 1
          pattern: "\\S"
        timestamp:
          type: "string"
          format: "date-time"
          readOnly: true
        pizzas:
          type: "array"
          readOnly: true
          items:
            $ref: "#/components/schemas/Pizza"
    PersonUpdate:
      type: "object"
      required:
        - fname
      properties:
        fname:
          type: "string"
          description: "Nombre nuevo (el apellido no se cambia: lo identifica la URL)"
    Resumen:
      type: "object"
      properties:
        lname:
          type: "string"
        fname:
          type: "string"
        cantidad_pizzas:
          type: "integer"
          description: "Cantidad de pizzas que pidió la persona"
        total_gastado:
          type: "number"
          description: "Suma de los precios de sus pizzas"
    Error:
      type: "object"
      properties:
        status:
          type: "integer"
        title:
          type: "string"
        detail:
          type: "string"
        type:
          type: "string"

  responses:
    BadRequest:
      description: "Datos inválidos: falta un campo obligatorio o tiene un tipo incorrecto"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PersonNotFound:
      description: "No existe una persona con ese apellido o ID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PizzaNotFound:
      description: "No existe una pizza con ese ID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PersonAlreadyExists:
      description: "Ya existe una persona con ese apellido"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    lname:
      name: "lname"
      description: "Apellido de la persona"
      in: path
      required: true
      schema:
        type: "string"
    person_id_query:
      name: "person_id"
      description: "Filtrar por ID de persona (opcional)"
      in: query
      required: false
      schema:
        type: "integer"
    pizza_id:
      name: "pizza_id"
      description: "ID de la pizza"
      in: path
      required: true
      schema:
        type: "integer"

paths:
  /people:
    get:
      operationId: "people.read_all"
      tags:
        - "Personas"
      summary: "Listar todas las personas con sus pizzas"
      responses:
        "200":
          description: "Lista de personas"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: "people.create"
      tags:
        - "Personas"
      summary: "Crear una persona"
      requestBody:
        description: "Persona a crear"
        required: true
        content:
          application/json:
            schema:
              x-body-name: "person"
              $ref: "#/components/schemas/Person"
      responses:
        "201":
          description: "Persona creada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/PersonAlreadyExists"

  /people/{lname}:
    get:
      operationId: "people.read_one"
      tags:
        - "Personas"
      summary: "Consultar una persona por apellido"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Persona encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/PersonNotFound"
    put:
      operationId: "people.update"
      tags:
        - "Personas"
      summary: "Actualizar el nombre de una persona"
      parameters:
        - $ref: "#/components/parameters/lname"
      requestBody:
        description: "Datos a modificar"
        required: true
        content:
          application/json:
            schema:
              x-body-name: "person"
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: "Persona actualizada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PersonNotFound"
    delete:
      operationId: "people.delete"
      tags:
        - "Personas"
      summary: "Borrar una persona y todas sus pizzas"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "204":
          description: "Persona borrada (sin contenido)"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /people/{lname}/pizzas:
    get:
      operationId: "people.read_pizzas"
      tags:
        - "Personas"
      summary: "Listar las pizzas de una persona"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Pizzas de la persona (de la más nueva a la más vieja)"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pizza"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /people/{lname}/resumen:
    get:
      operationId: "people.read_resumen"
      tags:
        - "Personas"
      summary: "Resumen de una persona: cantidad de pizzas y total gastado"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Resumen de la persona"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resumen"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /pizzas:
    get:
      operationId: "pizzas.read_all"
      tags:
        - "Pizzas"
      summary: "Listar todas las pizzas (opcionalmente, solo las de una persona)"
      parameters:
        - $ref: "#/components/parameters/person_id_query"
      responses:
        "200":
          description: "Lista de pizzas"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pizza"
        "404":
          $ref: "#/components/responses/PersonNotFound"
    post:
      operationId: "pizzas.create"
      tags:
        - "Pizzas"
      summary: "Crear una pizza asociada a una persona"
      requestBody:
        description: "Pizza a crear"
        required: true
        content:
          application/json:
            schema:
              x-body-name: "pizza"
              allOf:
                - $ref: "#/components/schemas/Pizza"
                - required:
                    - person_id
                    - content
                    - price
      responses:
        "201":
          description: "Pizza creada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pizza"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /pizzas/{pizza_id}:
    get:
      operationId: "pizzas.read_one"
      tags:
        - "Pizzas"
      summary: "Consultar una pizza por ID"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      responses:
        "200":
          description: "Pizza encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pizza"
        "404":
          $ref: "#/components/responses/PizzaNotFound"
    put:
      operationId: "pizzas.update"
      tags:
        - "Pizzas"
      summary: "Modificar una pizza (contenido, precio y tamaño)"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      requestBody:
        description: "Datos a modificar"
        required: true
        content:
          application/json:
            schema:
              x-body-name: "pizza"
              allOf:
                - $ref: "#/components/schemas/Pizza"
                - required:
                    - content
                    - price
      responses:
        "200":
          description: "Pizza actualizada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pizza"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PizzaNotFound"
    delete:
      operationId: "pizzas.delete"
      tags:
        - "Pizzas"
      summary: "Borrar una pizza"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      responses:
        "204":
          description: "Pizza borrada (sin contenido)"
        "404":
          $ref: "#/components/responses/PizzaNotFound"
